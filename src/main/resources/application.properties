spring.application.name=AutoAndes-Backend
spring.profiles.default=dev
server.port=${PORT:8080}

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:autoandes}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

app.zona-horaria=America/Lima
app.cors.origen=${FRONTEND_ORIGIN:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-segundos=3600
springdoc.swagger-ui.path=/swagger-ui.html
